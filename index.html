<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Block Studio FINAL++</title>

<style>
body{margin:0;display:flex;height:100vh;font-family:Arial;}

#sidebar{
  width:280px;
  background:#222;
  color:white;
  padding:10px;
  overflow-y:auto;
}

#workspace{
  flex:1;
  padding:20px;
  background:#f4f4f4;
  overflow-y:auto;
}

.category{margin-bottom:15px;background:#333;padding:8px;}

.categoryHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.categoryHeader strong{flex:1;}

.blockButton{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  margin-bottom:5px;
  padding:6px;
  border:none;
  color:white;
  cursor:pointer;
  box-sizing:border-box;
}

.blockButton span{
  min-width:0;
  overflow:hidden;
}

.smallBtn{
  background:red;
  color:white;
  border:none;
  cursor:pointer;
  padding:2px 6px;
  margin-left:4px;
  width:auto;
}

.editBtn{
  background:orange;
}

.weightBtn{
  background:#555;
}

.weightBtn.active{
  background:#0b8f4d;
}

.workspaceActions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:6px;
  margin-bottom:14px;
}

.outputGroup{margin-bottom:15px;}

.outputBlock{
  background:white;
  padding:8px;
  margin:5px 0;
  border-left:6px solid black;
  white-space:pre-wrap;
}

input, select, button{width:100%;margin-bottom:6px;padding:6px;box-sizing:border-box;}
#importFile{display:none;}
</style>
</head>
<body>

<div id="sidebar">

<h3>Kategorie</h3>
<input id="catName" placeholder="Name">
<input id="catColor" placeholder="Farbe">
<button onclick="addCategory()">Add</button>

<hr>

<h3>Block</h3>
<input id="blockText" placeholder="Text">
<select id="categorySelect"></select>
<button onclick="addBlock()">Add Block</button>

<hr>

<div id="categories"></div>

</div>

<div id="workspace">
<h2>Workspace</h2>
<div class="workspaceActions">
  <button onclick="surpriseMe()">🎲 Überrasch mich</button>
  <button onclick="copyWorkspace()">Workspace kopieren</button>
  <button onclick="clearWorkspace()">Workspace leeren</button>
  <button onclick="exportJson()">Export (.json)</button>
  <button onclick="document.getElementById('importFile').click()">Import (.json)</button>
</div>
<input id="importFile" type="file" accept="application/json,.json" onchange="importJson(event)">
<div id="output"></div>
</div>

<script>
let categories = JSON.parse(localStorage.getItem("cats")) || [];
let workspaceItems = JSON.parse(localStorage.getItem("workspaceItems")) || [];

function save(){
  localStorage.setItem("cats", JSON.stringify(categories));
  localStorage.setItem("workspaceItems", JSON.stringify(workspaceItems));
}

function randomInt(min, max){
  min = Math.ceil(Number(min));
  max = Math.floor(Number(max));

  if(Number.isNaN(min)) min = 0;
  if(Number.isNaN(max)) max = 100;
  if(min > max) [min, max] = [max, min];

  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function replaceRng(text){
  return String(text).replace(/\/\/rng(?:\/(-?\d+),(-?\d+))?\/\//g, (_, min, max) => {
    return min === undefined ? randomInt(0, 100) : randomInt(min, max);
  });
}

function normalizeBlock(block){
  if(typeof block === "string") return {text:block, weight:"normal"};
  return {
    text:String(block.text || ""),
    weight:["favorite","rare","excluded","mandatory"].includes(block.weight) ? block.weight : "normal"
  };
}

function setBlockWeight(categoryIndex, blockIndex, weight){
  let block=normalizeBlock(categories[categoryIndex].blocks[blockIndex]);
  block.weight = block.weight === weight ? "normal" : weight;
  categories[categoryIndex].blocks[blockIndex]=block;
  save();
  renderCategories();
}

function weightedPick(pool){
  let weighted=[];
  pool.forEach(block=>{
    let copies=block.weight === "favorite" ? 5 : block.weight === "rare" ? 1 : 3;
    for(let i=0;i<copies;i++) weighted.push(block);
  });
  return weighted[randomInt(0, weighted.length-1)];
}

function renderCategories(){
  const c=document.getElementById("categories");
  c.innerHTML="";

  categories.forEach((cat,i)=>{
    let div=document.createElement("div");
    div.className="category";

    let header=document.createElement("div");
    header.className="categoryHeader";

    let title=document.createElement("strong");
    title.textContent=cat.name;

    let editCat=document.createElement("button");
    editCat.textContent="✏️";
    editCat.className="smallBtn editBtn";
    editCat.onclick=()=>{
      let oldName=cat.name;
      let newName=prompt("Neuer Name:", cat.name);
      let newColor=prompt("Neue Farbe:", cat.color);
      if(newName) {
        categories[i].name=newName;
        workspaceItems.forEach(item=>{
          if(item.categoryName === oldName) item.categoryName = newName;
        });
      }
      if(newColor) {
        categories[i].color=newColor;
        workspaceItems.forEach(item=>{
          if(item.categoryName === categories[i].name) item.color = newColor;
        });
      }
      save();
      renderCategories();
      renderWorkspace();
    };

    let delCat=document.createElement("button");
    delCat.textContent="X";
    delCat.className="smallBtn";
    delCat.onclick=()=>{
      if(confirm("Kategorie löschen?")){
        categories.splice(i,1);
        save();
        renderCategories();
      }
    };

    header.appendChild(title);
    header.appendChild(editCat);
    header.appendChild(delCat);
    div.appendChild(header);

    cat.blocks.forEach((rawBlock,j)=>{
      let block=normalizeBlock(rawBlock);
      let b=block.text;
      let row=document.createElement("div");
      row.className="blockButton";
      row.style.background=cat.color;

      let text=document.createElement("span");

      text.textContent = b.length > 33 ? b.substring(0,33) + "..." : b;
      text.title = b;

      text.style.flex=1;
      text.onclick=()=>addToWorkspace(b,cat);

      let fav=document.createElement("button");
      fav.textContent="♥";
      fav.title="Kommt bei Überrasch mich häufiger";
      fav.className="smallBtn weightBtn" + (block.weight === "favorite" ? " active" : "");
      fav.onclick=()=>setBlockWeight(i,j,"favorite");

      let rare=document.createElement("button");
      rare.textContent="🗑";
      rare.title="Kommt bei Überrasch mich seltener";
      rare.className="smallBtn weightBtn" + (block.weight === "rare" ? " active" : "");
      rare.onclick=()=>setBlockWeight(i,j,"rare");

      let excl=document.createElement("button");
      excl.textContent="💣";
      excl.title="Bei Überrasch mich ausschließen";
      excl.className="smallBtn weightBtn" + (block.weight === "excluded" ? " active" : "");
      excl.onclick=()=>setBlockWeight(i,j,"excluded");

      let mand=document.createElement("button");
      mand.textContent="🔥";
      mand.title="Immer bei Überrasch mich dabei (Pflicht)";
      mand.className="smallBtn weightBtn" + (block.weight === "mandatory" ? " active" : "");
      mand.onclick=()=>setBlockWeight(i,j,"mandatory");

      let edit=document.createElement("button");
      edit.textContent="✏️";
      edit.className="smallBtn editBtn";
      edit.onclick=()=>{
        let newText=prompt("Neuer Text:", b);
        if(newText){
          categories[i].blocks[j]={...block,text:newText};
          save();
          renderCategories();
        }
      };

      let del=document.createElement("button");
      del.textContent="X";
      del.className="smallBtn";
      del.onclick=()=>{
        categories[i].blocks.splice(j,1);
        save();
        renderCategories();
      };

      row.appendChild(text);
      row.appendChild(fav);
      row.appendChild(rare);
      row.appendChild(excl);
      row.appendChild(mand);
      row.appendChild(edit);
      row.appendChild(del);

      div.appendChild(row);
    });

    c.appendChild(div);
  });

  updateSelect();
}

function updateSelect(){
  let s=document.getElementById("categorySelect");
  s.innerHTML="";
  categories.forEach((cat,i)=>{
    let o=document.createElement("option");
    o.value=i;
    o.textContent=cat.name;
    s.appendChild(o);
  });
}

function addCategory(){
  let name=catName.value;
  let color=catColor.value||"blue";
  if(!name) return;

  categories.push({name,color,blocks:[]});
  catName.value="";
  catColor.value="";
  save();
  renderCategories();
}

function addBlock(){
  let text=blockText.value;
  let i=categorySelect.value;
  if(!text || i === "") return;

  categories[i].blocks.push({text,weight:"normal"});
  blockText.value="";
  save();
  renderCategories();
}

function addToWorkspace(text,cat){
  workspaceItems.push({
    categoryName: cat.name,
    color: cat.color,
    text: replaceRng(text)
  });
  save();
  renderWorkspace();
}

function renderWorkspace(){
  let container=document.getElementById("output");
  container.innerHTML="";

  workspaceItems.forEach(item=>{
    let group=document.querySelector(`[data-cat="${CSS.escape(item.categoryName)}"]`);

    if(!group){
      group=document.createElement("div");
      group.className="outputGroup";
      group.dataset.cat=item.categoryName;

      let title=document.createElement("h3");
      title.textContent=item.categoryName;

      group.appendChild(title);
      container.appendChild(group);
    }

    let div=document.createElement("div");
    div.className="outputBlock";
    div.style.borderColor=item.color;
    div.textContent=item.text;

    group.appendChild(div);
  });
}

function surpriseMe(){
  categories.forEach(cat=>{
    if(!cat.blocks.length) return;

    let unique=new Map();
    cat.blocks.map(normalizeBlock).forEach(block=>{
      if(block.text && !unique.has(block.text)) unique.set(block.text, block);
    });
    let all=[...unique.values()];

    let mandatory=all.filter(block=>block.weight === "mandatory");
    let pool=all.filter(block=>block.weight !== "excluded" && block.weight !== "mandatory");

    let amount=randomInt(0,5);
    let picks=[...mandatory];

    while(picks.length < amount + mandatory.length && pool.length){
      let selected=weightedPick(pool);
      picks.push(selected);
      pool=pool.filter(block=>block.text !== selected.text);
    }

    picks.forEach(block=>addToWorkspace(block.text,cat));
  });
}

function getWorkspaceText(){
  return workspaceItems.map(item=>`${item.categoryName}: ${item.text}`).join("\n");
}

async function copyWorkspace(){
  let text=getWorkspaceText();
  if(!text) return;

  try{
    await navigator.clipboard.writeText(text);
    alert("Workspace kopiert.");
  }catch(error){
    let helper=document.createElement("textarea");
    helper.value=text;
    document.body.appendChild(helper);
    helper.select();
    document.execCommand("copy");
    helper.remove();
    alert("Workspace kopiert.");
  }
}

function clearWorkspace(){
  if(!workspaceItems.length) return;
  if(!confirm("Workspace wirklich leeren?")) return;

  workspaceItems=[];
  save();
  renderWorkspace();
}

function exportJson(){
  let data={
    version:1,
    exportedAt:new Date().toISOString(),
    categories,
    workspaceItems
  };
  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="block-editor-export.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importJson(event){
  let file=event.target.files[0];
  event.target.value="";
  if(!file) return;

  let reader=new FileReader();
  reader.onload=()=>{
    try{
      let data=JSON.parse(reader.result);
      if(!Array.isArray(data.categories)) throw new Error("categories fehlt");

      categories=data.categories.map(cat=>({
        ...cat,
        blocks:Array.isArray(cat.blocks) ? cat.blocks.map(normalizeBlock) : []
      }));
      workspaceItems=Array.isArray(data.workspaceItems) ? data.workspaceItems : [];
      save();
      renderCategories();
      renderWorkspace();
    }catch(error){
      alert("Import fehlgeschlagen: Die JSON-Datei passt nicht zu diesem Editor.");
    }
  };
  reader.readAsText(file);
}

renderCategories();
renderWorkspace();
</script>

</body>
</html>
